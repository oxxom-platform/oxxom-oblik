name: Security error responses
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/test_security_update.py'
      - 'tests/verify_error_proxy.py'
      - 'deploy/ubuntu/*security*'
      - '.github/workflows/security-errors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      DJANGO_SECRET_KEY: synthetic-ci-only-secret-key-not-for-deployment-1234567890
      POSTGRES_DB: unused
      POSTGRES_USER: unused
      POSTGRES_PASSWORD: synthetic-ci-only-not-a-production-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python backend/manage.py test core.test_errors --noinput
      - run: python -m unittest discover -s tests -p test_security_update.py -v
      - run: python backend/manage.py build_error_pages /tmp/oblik-errors-ci
      - run: python tests/verify_error_proxy.py /tmp/oblik-errors-ci
