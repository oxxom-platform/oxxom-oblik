name: Security verification
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - '.gitleaksignore'
      - 'deploy/ubuntu/*request*'
      - 'deploy/ubuntu/*session*'
      - 'deploy/ubuntu/collect-runtime.py'
      - 'deploy/ubuntu/check-runtime.sh'
      - 'deploy/ubuntu/audit-backups.py'
      - 'deploy/ubuntu/audit-backups.sh'
      - 'tests/test_request_update.py'
      - 'tests/test_session_update.py'
      - 'tests/test_runtime_inventory.py'
      - 'tests/test_backup_audit.py'
      - '.github/workflows/security-verification.yml'
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan available Git history without printing matched values
        shell: bash
        run: |
          umask 077
          set +e
          /tmp/gitleaks git --redact=100 --log-opts='--all' --gitleaks-ignore-path .gitleaksignore \
            --report-format json --report-path /tmp/gitleaks-private.json \
            > /tmp/gitleaks-private.log 2>&1
          scan_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('/tmp/gitleaks-private.json')
          if not source.is_file():
              raise SystemExit('Secret scan did not produce evidence; private log requires review')
          rows = json.loads(source.read_text())
          safe = [{key: row.get(key) for key in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}
                  for row in rows]
          Path('secret-scan-summary.json').write_text(json.dumps({'findings': safe}, indent=2))
          print('History findings requiring review:', len(safe), '; secret values omitted')
          PY
          exit "$scan_status"
      - name: Retain metadata-only secret scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-secret-scan-metadata
          path: secret-scan-summary.json
          retention-days: 30
          if-no-files-found: error
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_locked_runtime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only-not-a-production-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DJANGO_SECRET_KEY: synthetic-ci-only-secret-key-not-for-deployment-1234567890
      POSTGRES_DB: ci_locked_runtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-ci-only-not-a-production-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and install only hashed binary runtime packages
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements-production.lock --dest /tmp/oblik-wheels
          python -m venv /tmp/oblik-runtime
          /tmp/oblik-runtime/bin/python -m pip install --no-index --find-links /tmp/oblik-wheels --require-hashes --only-binary=:all: -r requirements-production.lock
          /tmp/oblik-runtime/bin/python -m pip check
          /tmp/oblik-runtime/bin/python -m pip list --format=freeze --exclude pip --exclude setuptools --exclude wheel > runtime-pins.txt
      - name: Verify metadata and rejection of tampered wheels
        run: |
          python -m unittest discover -s tests -p test_runtime_inventory.py -v
          python deploy/ubuntu/collect-runtime.py --lock requirements-production.lock --python /tmp/oblik-runtime/bin/python > runtime-lock-comparison.json
      - name: Verify the pinned read-only launcher against the isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh deploy/ubuntu/check-runtime.sh "$REVIEWED_SHA" /tmp/oblik-runtime/bin/python
      - name: Full Django suite under the locked runtime and PostgreSQL
        working-directory: backend
        run: |
          /tmp/oblik-runtime/bin/python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          os.environ['OXXOM_MFA_KEY'] = Fernet.generate_key().decode()
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          import django
          django.setup()
          from django.core.management import call_command
          call_command('test', interactive=False, verbosity=1)
          call_command('makemigrations', check=True, dry_run=True)
          PY
      - name: Install advisory tooling outside the runtime
        run: |
          python -m venv /tmp/oblik-auditor
          /tmp/oblik-auditor/bin/python -m pip install pip-audit==2.10.1
      - name: Audit every resolved runtime package; fail on lookup errors
        run: >-
          /tmp/oblik-auditor/bin/python -m pip_audit -r runtime-pins.txt
          --no-deps --disable-pip --strict --progress-spinner off
          --format json --output dependency-audit.json
      - name: Retain version-specific dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-dependency-evidence
          path: |
            runtime-pins.txt
            dependency-audit.json
            runtime-lock-comparison.json
          retention-days: 30
          if-no-files-found: error
  updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_request_update.py -v
      - run: python -m unittest discover -s tests -p test_session_update.py -v
