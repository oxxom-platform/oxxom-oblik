</style><body><aside><div class="brand">OXXOM<span>ОБЛІК</span></div><div class="company">ДК <strong>Локальна компанія<small>Робочий простір</small></strong></div><nav id="nav"></nav><footer>Локальна розробка<br><small>Продажі зберігаються в SQLite</small></footer></aside><main><header><span>Робочий простір / <b id="crumb">Огляд</b></span><div><span class="demo">ЛОКАЛЬНО · БЕЗ АВТОРИЗАЦІЇ</span> <span class="avatar">ВК</span></div></header><section id="content"></section></main><dialog id="dialog"></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s),money=n=>Number(n).toLocaleString('uk-UA')+' ₴',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=['Огляд','Продажі','Склад','Контрагенти','Фінанси','Звіти','Команда','Безпека'],icons=['◈','↗','▧','♧','◉','▥','♙','◇'];let page='Продажі',filter='Усі',query='';

async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken,...options.headers}});const result=await response.json();if(!response.ok)throw new Error(result.error||'Помилка сервера');return result}

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}function badge(t){return `<span class="badge ${t==='Чернетка'?'gray':/Очікує|Мало/.test(t)?'warn':''}">${esc(t)}</span>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Нічого не знайдено. Змініть пошук.</div>'}</div>`}function heading(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function cards(items){return `<div class="cards">${items.map(([t,v,s])=>`<div class="card"><label>${t}</label><div class="value">${v}</div><span class="positive">${s}</span></div>`).join('')}</div>`}function salesTable(list){return table(['Документ','Дата','Контрагент','Сума','Статус'],list.map(s=>[`<button class="link" data-doc="${esc(s.id)}">${esc(s.id)}</button>`,s.date,esc(s.client),money(s.sum),badge(s.status)]))}
function go(p){page=p;query='';filter='Усі';render()}function render(){ $('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${p}" class="${page===p?'active':''}"><i>${icons[i]}</i>${p}</button>`).join('');$('#crumb').textContent=page;let html='';

жі">Усі документи →</button></div>${salesTable(sales.slice(0,5))}</div>`}
if(page==='Продажі')html=heading('Продажі','Документи, оплати та повернення під контролем.','<button class="primary" data-new>＋ Новий продаж</button>')+`<div class="tabs">${['Усі','Очікує оплати','Оплачено','Чернетка'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div class="panel"><div class="toolbar"><input type="search" id="search" placeholder="Пошук за номером або клієнтом" value="${esc(query)}"><button class="secondary" id="export">↓ Експорт CSV</button></div><div id="results">${saleResults()}</div></div>`;
if(page==='Склад')html=heading('Склад','Залишки, вартість та товари, які варто поповнити.')+cards([['Найменувань','6','У двох складах'],['Вартість за цінами',money(products.reduce((a,p)=>a+p[3]*p[4],0)),'Демонстраційні залишки'],['Низький залишок','2 товари','Менше 10 одиниць']])+`<div class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Назва або артикул" value="${esc(query)}"><select id="warehouse"><option>Усі склади</option><option>Основний</option><option>Магазин</option></select></div><div id="results">${stockResults()}</div></div>`;
if(page==='Контрагенти')html=heading('Контрагенти','Клієнти, історія документів та взаєморозрахунки.')+`<div class="panel">${table(['Назва','Тип','Документів','Очікуємо оплату',''],[...new Set(sales.map(s=>s.client))].map(c=>[esc(c),'Клієнт',sales.filter(s=>s.client===c).length,money(sales.filter(s=>s.client===c&&s.status==='Очікує оплати').reduce((a,s)=>a+s.sum,0)),`<button class="link" data-client="${esc(c)}">Відкрити →</button>`]))}</div>`;
if(page==='Фінанси')html=heading('Фінанси','Стан оплат за демонстраційними продажами.')+cards([['Оплачено',money(sales.filter(s=>s.status==='Оплачено').reduce((a,s)=>a+s.sum,0)),'Підтверджені в демо'],['Очікує оплати',money(sales.filter(s=>s.status==='Очікує оплати').reduce((a,s)=>a+s.sum,0)),'Дебіторська заборгованість'],['Чернетки',money(sales.filter(s=>s.status==='Чернетка').reduce((a,s)=>a+s.sum,0)),'Не включені в продажі']])+`<div class="panel"><h2>Документи до оплати</h2>${salesTable(sales.filter(s=>s.status==='Очікує оплати'))}</div>`;
if(page==='Звіти')html=heading('Звіти','Швидка перевірка результатів за документами демо.')+`<div class="panel"><div class="bar"><h2>Продажі за контрагентами</h2><button class="secondary" id="export">↓ Документи CSV</button></div>${table(['Контрагент','Продажі без чернеток','Оплачено'],[...new Set(sales.map(s=>s.client))].map(c=>[esc(c),money(sales.filter(s=>s.client===c&&s.status!=='Чернетка').reduce((a,s)=>a+s.sum,0)),money(sales.filter(s=>s.client===c&&s.status==='Оплачено').reduce((a,s)=>a+s.sum,0))]))}</div>`;

if(page==='Безпека')html=heading('Безпека','Зручний вхід із додатковим захистом.')+`<div class="notice">Це демонстрація сценарію. Справжній вхід, TOTP та резервні коди ще не реалізовані.</div><div class="panel security"><span class="badge">Сценарій 2FA</span><h1 style="margin-top:24px">Підтвердьте вхід</h1><p>У робочій версії тут буде код із вашого застосунку-аутентифікатора.</p><form id="verify"><label class="field">Демонстраційний код: 123456<input class="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required placeholder="000000"></label><button class="primary" style="width:100%">Підтвердити демо-вхід</button></form><p id="verifyResult" role="status"></p><hr style="border:0;border-top:1px solid #e5eae6"><p>У плані: резервні коди, керування сесіями, журнал входів і обов’язкова 2FA для адміністраторів.</p></div>`;
$('#content').innerHTML='<div class="notice">Локальна версія: чернетки продажів зберігаються в базі. Склад, графік, ролі та 2FA — демонстраційні. Бухгалтерські проведення ще не реалізовані.</div>'+html;bind()}
function saleResults(){return salesTable(sales.filter(s=>(filter==='Усі'||s.status===filter)&&(s.id+' '+s.client).toLowerCase().includes(query.toLowerCase())))}function stockResults(w='Усі склади'){return table(['Артикул','Товар','Склад','Залишок','Ціна'],products.filter(p=>(w==='Усі склади'||p[2]===w)&&(p[0]+' '+p[1]).toLowerCase().includes(query.toLowerCase())).map(p=>[p[0],p[1],p[2],p[3]+' шт '+(p[3]<10?badge('Мало'):''),money(p[4])]))}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-new]').forEach(b=>b.onclick=newSale);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});bindRows();if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#results').innerHTML=page==='Склад'?stockResults($('#warehouse').value):saleResults();bindRows()};if($('#warehouse'))$('#warehouse').onchange=e=>$('#results').innerHTML=stockResults(e.target.value);if($('#export'))$('#export').onclick=exportCSV;if($('#verify'))$('#verify').onsubmit=e=>{e.preventDefault();$('#verifyResult').textContent=e.target.code.value==='123456'?'Демо-сценарій успішно пройдено. Справжньої авторизації немає.':'Для демонстрації введіть 123456.'}}
function bindRows(){document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{const s=sales.find(s=>s.id===b.dataset.doc);modal(`<h2>${esc(s.id)}</h2><p>${esc(s.client)} · ${s.date}</p><div class="value">${money(s.sum)}</div>${badge(s.status)}${s.items?.length?table(['Позиція','Тип','Кількість','Ціна'],s.items.map(i=>[esc(i.name),esc(i.kind),esc(i.qty)+' '+esc(i.unit),money(i.price)])):''}<p>Демонстраційний документ. Не є бухгалтерським проведенням.</p>${s.status==='Очікує оплати'?'<button class="primary" id="pay">Позначити оплаченим у демо</button>':''}`);if($('#pay'))$('#pay').onclick=()=>toast('Облік оплат ще не реалізований')});document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>modal(`<h2>${esc(b.dataset.client)}</h2><p>Історія документів клієнта</p>${salesTable(sales.filter(s=>s.client===b.dataset.client))}`))}
function modal(html){$('#dialog').innerHTML=`<div class="bar"><small>OXXOM Облік · демо</small><button class="secondary" id="close" aria-label="Закрити">✕</button></div>${html}`;$('#close').onclick=()=>$('#dialog').close();$('#dialog').showModal()}
function newSale(){
page='Новий продаж';$('#crumb').textContent=page;
$('#content').innerHTML=heading('Новий продаж','Введіть товар або послугу вручну чи виберіть із каталогу.','<button class="secondary" id="back">← До продажів</button>')+`<form id="saleform"><div class="panel"><div class="formgrid"><div class="field"><label for="client">Контрагент</label><input id="client" name="client" required maxlength="120" placeholder="Назва клієнта"></div><div class="field"><label for="date">Дата документа</label><input id="date" name="date" type="date" value="${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}" required></div></div><h2>Товар або послуга</h2><div class="tabs"><button type="button" id="manualMode" class="selected" aria-pressed="true">✎ Ввести вручну</button><button type="button" id="catalogMode" aria-pressed="false">Вибрати з каталогу</button></div><div id="catalogField" class="field" style="display:none"><label for="product">Заповнити з каталогу (необов’язково)</label><select id="product"><option value="">Ручне введення</option>${products.map((p,i)=>`<option value="${i}">${p[1]} · ${money(p[4])}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label for="kind">Тип позиції</label><select id="kind" name="kind"><option>Товар</option><option>Послуга</option></select></div><div class="field"><label for="itemName">Назва товару або послуги</label><input id="itemName" name="itemName" required maxlength="200" placeholder="Наприклад: налаштування мережі"></div><div class="field"><label for="price">Ціна за одиницю, ₴</label><input id="price" name="price" type="number" min="0" max="100000000" step="0.01" required placeholder="1500.00"></div><div class="field"><label for="qty">Кількість</label><input id="qty" name="qty" type="number" min="0.001" max="10000" step="0.001" value="1" required></div><div class="field"><label for="unit">Одиниця виміру</label><input id="unit" name="unit" required maxlength="20" value="шт" placeholder="шт, год, послуга"></div></div><div class="notice">Назву й ціну можна редагувати навіть після вибору з каталогу. Чернетка зберігається в локальній базі на комп’ютері. Складські залишки не змінюються.</div><div class="total"><span>Разом</span><strong id="sum">0 ₴</strong><button class="primary" type="submit">Зберегти чернетку</button></div></div></form>`;
$('#back').onclick=()=>go('Продажі');
const setEntryMode=manual=>{ $('#catalogField').style.display=manual?'none':'flex';$('#manualMode').classList.toggle('selected',manual);$('#catalogMode').classList.toggle('selected',!manual);$('#manualMode').setAttribute('aria-pressed',String(manual));$('#catalogMode').setAttribute('aria-pressed',String(!manual));if(manual){$('#product').value='';$('#itemName').focus()}else $('#product').focus()};
$('#manualMode').onclick=()=>setEntryMode(true);$('#catalogMode').onclick=()=>setEntryMode(false);

const calc=()=>Math.round((Number($('#price').value)*100)*Number($('#qty').value))/100;
const total=()=>$('#sum').textContent=money(calc());
$('#qty').oninput=total;$('#price').oninput=total;
$('#kind').onchange=()=>{$('#unit').value=$('#kind').value==='Послуга'?'послуга':'шт';$('#product').value=''};
$('#itemName').oninput=()=>$('#product').value='';
$('#product').onchange=()=>{const v=$('#product').value;if(v==='')return;const p=products[Number(v)];$('#itemName').value=p[1];$('#price').value=p[4];$('#kind').value='Товар';$('#unit').value='шт';total()};
$('#saleform').onsubmit=async e=>{e.preventDefault();const f=e.target;const get=n=>f.elements.namedItem(n).value;const client=get('client').trim(),name=get('itemName').trim(),unit=get('unit').trim(),price=Number(get('price')),qty=Number(get('qty'));if(!client||!name||!unit){toast('Заповніть назву клієнта, позиції та одиницю виміру');return}if(!Number.isFinite(price)||price<0||!Number.isFinite(qty)||qty<=0||!f.reportValidity())return;const item={kind:get('kind'),name,unit,price,qty};const button=f.querySelector('[type="submit"]');button.disabled=true;button.textContent='Збереження…';try{const saved=await api('/api/sales',{method:'POST',body:JSON.stringify({client,date:get('date'),items:[item]})});sales.unshift(saved);go('Продажі');toast('Чернетку збережено в локальній базі')}catch(error){toast(error.message)}finally{button.disabled=false;button.textContent='Зберегти чернетку'}};

}
function exportCSV(){const safe=x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const csv='\uFEFF'+[['Документ','Дата','Клієнт','Сума','Статус'],...sales.map(s=>[s.id,s.date,s.client,s.sum,s.status])].map(r=>r.map(safe).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='oxxom-demo-sales.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}boot();
</script></body></html>
